name: Build Kernel spes 4.19 BPF + KernelSU Next

"on":
workflow_dispatch:
push:
branches:
- main-a16-sm8250-base

jobs:
Build-Kernel:
runs-on: ubuntu-latest

permissions:
  contents: read

steps:
  - name: Build Kernel spes 4.19 BPF + KernelSU Next
    uses: dabao1955/kernel_build_action@main
    with:
      kernel-url: https://github.com/JDev09/kernel_xiaomi_spes
      kernel-dir: msm-4.19
      kernel-branch: main-a16-sm8250-base
      config: vendor/spes-perf_defconfig
      arch: arm64
      aosp-gcc: true
      aosp-clang: true
      aosp-clang-version: r596125
      ksu-other: true
      ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
      anykernel3: true
      anykernel3-url: https://github.com/JDev09/AnyKernel3
      extra-make-args: LLVM=1 LLVM_IAS=1
