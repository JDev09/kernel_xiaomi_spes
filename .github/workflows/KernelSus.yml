name: Build Kernel+KernelSU-Next spes 4.19

on:
  workflow_dispatch:
  push:
    branches:
      - main-a16-sm8250-base

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Build Kernel spes 4.19 + KernelSU-Next
        uses: dabao1955/kernel_build_action@main
        with:
          # =========================
          # Kernel
          # =========================
          kernel-url: https://github.com/JDev09/kernel_xiaomi_spes
          kernel-dir: msm-4.19
          kernel-branch: main-a16-sm8250-base
          config: vendor/spes-perf_defconfig
          arch: arm64

          # =========================
          # Toolchains
          # =========================
          aosp-gcc: true
          aosp-clang: true
          aosp-clang-version: r596125

          # =========================
          # KernelSU-Next
          # =========================
          ksu: false
          ksu-other: true
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
          ksu-version: main
          ksu-lkm: false

          # =========================
          # AnyKernel3
          # =========================
          anykernel3: true
          anykernel3-url: https://github.com/JDev09/AnyKernel3

          # =========================
          # Build flags
          # =========================
          extra-make-args: LLVM=1 LLVM_IAS=1