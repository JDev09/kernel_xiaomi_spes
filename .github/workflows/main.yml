# A simple action usage
name: Build Kernel spes 4.19 BPF KSUN
on:
  workflow_dispatch:
  push:
    branches:
      - kernel-spes/n-ksun

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel spes 4.19 BPF KSUN
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/JDev09/kernel_xiaomi_spes/
          kernel-dir: msm-4.19
          kernel-branch: kernel-spes/n-ksun
          config: spes-perf_defconfig # Asegúrate de que coincida con la ruta real en tu fuente
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu-other: true
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
          aosp-clang-version: r596125
          anykernel3: true
          anykernel3-url: https://github.com/JDev09/AnyKernel3
          extra-make-args: LLVM=1 LLVM_IAS=1